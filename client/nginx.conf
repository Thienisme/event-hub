server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API và client cùng origin: chuyển /api/... sang service server.
    # proxy_pass không có dấu "/" ở cuối để giữ nguyên đường dẫn /api/...
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router dùng history mode: mọi đường dẫn không phải file tĩnh đều
    # trả index.html để F5 ở /my-orders không bị 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
